@if (segments && segments.length > 0) {
  <div class="distribution-content">
    <div class="donut-canvas-wrap">
      <canvas #canvasRef></canvas>
      <div class="donut-center">
        <span class="donut-center-text">{{total}}</span>
        <span class="donut-center-label">Total</span>
      </div>
    </div>

    <div class="distribution-legend">
      @for (segment of segments; track segment.category) {
        <div class="legend-item">
          <div class="legend-color" [style.background-color]="segment.color"></div>
          <div class="legend-details">
            <span class="legend-label">{{segment.category}}</span>
            <div>
              <span class="legend-percentage">{{segment.percentage}}%</span>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
} @else {
  <div class="empty-chart">
    <i class="bi bi-pie-chart"></i>
    <p class="mb-0">No hay datos de distribución</p>
  </div>
}
