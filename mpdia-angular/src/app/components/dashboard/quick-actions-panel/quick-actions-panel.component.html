<div class="actions-section">
  <div class="d-flex flex-wrap gap-2">
    <button 
      class="btn btn-primary"
      (click)="onGenerateInsights()"
      aria-label="Generar nuevos insights con IA">
      <i class="bi bi-lightbulb me-2"></i>
      Generar Insights
    </button>
    <button 
      class="btn btn-outline-primary"
      (click)="onViewReports()"
      aria-label="Ver reportes ejecutivos del proyecto">
      <i class="bi bi-file-earmark-bar-graph me-2"></i>
      Ver Reportes
    </button>
    <button 
      class="btn btn-outline-primary"
      (click)="onViewRetrospectives()"
      aria-label="Ver retrospectivas inteligentes">
      <i class="bi bi-arrow-repeat me-2"></i>
      Ver Retrospectivas
    </button>
    <button 
      class="btn btn-outline-secondary"
      (click)="onViewInsights()"
      aria-label="Ver todos los insights generados">
      <i class="bi bi-list-ul me-2"></i>
      Ver Todos los Insights
    </button>
  </div>
</div>
